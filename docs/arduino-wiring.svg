<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">虫迹中国 Arduino UNO R3 接线原理图</title>
  <desc id="desc">Arduino UNO R3 连接 DHT11 温湿度传感器、一个通用裸光敏电阻和一个独立 10kΩ 电阻组成的分压电路，以及可选 HC-SR501 人体红外传感器，并通过 USB 连接 Windows 电脑。</desc>
  <defs>
    <style>
      .title { font: 700 38px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #263024; }
      .subtitle { font: 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #6b6f5e; }
      .section { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #263024; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #263024; }
      .small { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #565b4e; }
      .tiny { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #565b4e; }
      .pin { font: 700 16px Consolas, "Microsoft YaHei", sans-serif; fill: #f8f3e8; }
      .wire { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .power { stroke: #c94f3d; }
      .ground { stroke: #333a36; }
      .d2 { stroke: #dc8d23; }
      .a0 { stroke: #2d8b75; }
      .d3 { stroke: #397bb5; }
      .usb { stroke: #7659a7; }
      .dash { stroke-dasharray: 11 9; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#263024" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d8d4c7" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#f4efe3"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="0" y="0" width="1600" height="112" fill="#263024"/>
  <text x="72" y="62" class="title" style="fill:#f8f3e8">虫迹中国 · Arduino UNO R3 接线原理图</text>
  <text x="74" y="92" class="subtitle" style="fill:#dfe4d6">基础版：DHT11 + 裸光敏电阻 + 10kΩ 电阻　扩展：HC-SR501（仅检测观察者靠近）</text>

  <!-- Power rails -->
  <path class="wire power" d="M 640 298 H 735 V 164 H 1480"/>
  <circle cx="735" cy="164" r="10" fill="#c94f3d"/>
  <rect x="820" y="138" width="112" height="44" rx="22" fill="#c94f3d"/>
  <text x="876" y="167" class="pin" text-anchor="middle">5V 电源轨</text>

  <path class="wire ground" d="M 640 364 H 778 V 902 H 1480"/>
  <circle cx="778" cy="902" r="10" fill="#333a36"/>
  <rect x="822" y="880" width="128" height="44" rx="22" fill="#333a36"/>
  <text x="886" y="909" class="pin" text-anchor="middle">GND 共地</text>

  <!-- Windows computer -->
  <g filter="url(#shadow)">
    <rect x="48" y="378" width="150" height="118" rx="16" fill="#ffffff" stroke="#7659a7" stroke-width="4"/>
    <rect x="65" y="395" width="116" height="72" rx="6" fill="#eae4f4"/>
    <path d="M 102 496 H 144 L 158 520 H 88 Z" fill="#7659a7"/>
  </g>
  <text x="123" y="426" class="label" text-anchor="middle">Windows</text>
  <text x="123" y="452" class="small" text-anchor="middle">本地后端</text>
  <path class="wire usb" d="M 198 438 H 268"/>
  <text x="232" y="420" class="tiny" text-anchor="middle">USB</text>
  <text x="232" y="467" class="tiny" text-anchor="middle">供电 + 115200 串口</text>

  <!-- Arduino board -->
  <g filter="url(#shadow)">
    <path d="M 268 210 H 595 Q 640 210 640 255 V 770 Q 640 814 596 814 H 268 Z" fill="#1f7881" stroke="#15565d" stroke-width="6"/>
    <rect x="268" y="398" width="74" height="82" rx="8" fill="#d9d8d2" stroke="#878a82" stroke-width="4"/>
    <rect x="290" y="417" width="42" height="44" fill="#565b59"/>
    <rect x="378" y="416" width="112" height="170" rx="8" fill="#263024"/>
    <path d="M 399 436 h70 v130 h-70 z" fill="#303b33" stroke="#899180" stroke-width="2"/>
    <circle cx="392" cy="272" r="24" fill="#9eb7b2"/>
    <circle cx="392" cy="272" r="9" fill="#52635e"/>
    <rect x="292" y="686" width="88" height="66" rx="8" fill="#1d555b" stroke="#a2cbc7" stroke-width="3"/>
    <circle cx="410" cy="706" r="14" fill="#d6b23a"/>
    <circle cx="410" cy="706" r="5" fill="#fff2a5"/>
  </g>
  <text x="454" y="258" class="section" style="fill:#f8f3e8" text-anchor="middle">ARDUINO UNO R3</text>
  <text x="454" y="289" class="small" style="fill:#d8efec" text-anchor="middle">虫迹微气候采集器</text>
  <text x="434" y="458" class="label" style="fill:#f8f3e8" text-anchor="middle">ATmega328P</text>
  <text x="434" y="489" class="small" style="fill:#ccd8d0" text-anchor="middle">采样间隔 2 秒</text>
  <text x="434" y="528" class="small" style="fill:#ccd8d0" text-anchor="middle">CRC-16 二进制帧</text>
  <text x="332" y="732" class="tiny" style="fill:#d8efec" text-anchor="middle">USB-B</text>
  <text x="438" y="744" class="tiny" style="fill:#f8f3e8">D13 板载状态灯</text>
  <text x="438" y="770" class="tiny" style="fill:#d8efec">慢闪=正常　快闪=降级/故障</text>

  <!-- UNO pins -->
  <g>
    <rect x="576" y="276" width="88" height="44" rx="10" fill="#c94f3d"/>
    <text x="620" y="305" class="pin" text-anchor="middle">5V</text>
    <rect x="576" y="342" width="88" height="44" rx="10" fill="#333a36"/>
    <text x="620" y="371" class="pin" text-anchor="middle">GND</text>
    <rect x="576" y="444" width="88" height="44" rx="10" fill="#dc8d23"/>
    <text x="620" y="473" class="pin" text-anchor="middle">D2</text>
    <rect x="576" y="558" width="88" height="44" rx="10" fill="#2d8b75"/>
    <text x="620" y="587" class="pin" text-anchor="middle">A0</text>
    <rect x="576" y="678" width="88" height="44" rx="10" fill="#397bb5"/>
    <text x="620" y="707" class="pin" text-anchor="middle">D3</text>
  </g>

  <!-- DHT11 -->
  <path class="wire power" d="M 1108 164 V 232"/>
  <path class="wire ground" d="M 1308 396 V 902"/>
  <path class="wire d2" d="M 664 466 H 955 V 316 H 1040"/>
  <g filter="url(#shadow)">
    <rect x="1040" y="220" width="360" height="190" rx="24" fill="#fffdf8" stroke="#dc8d23" stroke-width="4"/>
    <rect x="1072" y="252" width="104" height="116" rx="12" fill="#4b8ba7"/>
    <g fill="#7fb2c8">
      <rect x="1089" y="270" width="16" height="16" rx="3"/><rect x="1116" y="270" width="16" height="16" rx="3"/><rect x="1143" y="270" width="16" height="16" rx="3"/>
      <rect x="1089" y="298" width="16" height="16" rx="3"/><rect x="1116" y="298" width="16" height="16" rx="3"/><rect x="1143" y="298" width="16" height="16" rx="3"/>
      <rect x="1089" y="326" width="16" height="16" rx="3"/><rect x="1116" y="326" width="16" height="16" rx="3"/><rect x="1143" y="326" width="16" height="16" rx="3"/>
    </g>
    <text x="1200" y="263" class="section">DHT11</text>
    <text x="1200" y="294" class="small">温湿度传感器</text>
    <text x="1200" y="331" class="label" fill="#c94f3d">VCC → 5V</text>
    <text x="1200" y="359" class="label" fill="#dc8d23">DATA → D2</text>
    <text x="1200" y="387" class="label" fill="#333a36">GND → GND</text>
  </g>
  <circle cx="1108" cy="232" r="8" fill="#c94f3d"/>
  <circle cx="1040" cy="316" r="8" fill="#dc8d23"/>
  <circle cx="1308" cy="396" r="8" fill="#333a36"/>

  <!-- Optional pull-up -->
  <path class="wire power dash" stroke-width="5" d="M 970 164 V 256 H 1002"/>
  <path class="wire d2 dash" stroke-width="5" d="M 1002 256 V 316 H 1040"/>
  <rect x="949" y="231" width="106" height="34" rx="8" fill="#f4efe3" stroke="#dc8d23" stroke-width="3"/>
  <text x="1002" y="253" class="tiny" text-anchor="middle">10kΩ 上拉</text>
  <text x="942" y="202" class="tiny" text-anchor="end">仅裸四针 DHT11 需要；三针模块通常已内置</text>

  <!-- LDR divider -->
  <path class="wire power" d="M 1425 164 V 560 H 1400"/>
  <path class="wire a0" d="M 664 580 H 930"/>
  <path class="wire ground" d="M 1214 686 V 902"/>
  <g filter="url(#shadow)">
    <rect x="930" y="482" width="470" height="214" rx="24" fill="#fffdf8" stroke="#2d8b75" stroke-width="4"/>
    <text x="962" y="525" class="section">裸光敏电阻（LDR）分压</text>
    <text x="962" y="554" class="small">两条腿无正负极；环境越亮，A0 原始值通常越高</text>
    <path class="wire power" d="M 1400 560 H 1214 V 582"/>
    <path class="wire a0" d="M 930 580 H 1088 V 622 H 1214"/>
    <circle cx="1214" cy="622" r="12" fill="#2d8b75" stroke="#fffdf8" stroke-width="4"/>
    <path d="M 1214 582 l-20 8 40 12-40 12 20 8" fill="none" stroke="#c94f3d" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 1214 622 l-20 10 40 14-40 14 40 14-20 10" fill="none" stroke="#333a36" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 1214 684 V 686" class="wire ground"/>
    <text x="1272" y="604" class="label">裸光敏电阻</text>
    <text x="1272" y="638" class="label">分压中点 → A0</text>
    <text x="1272" y="675" class="label">独立 10kΩ 电阻</text>
  </g>
  <circle cx="1425" cy="164" r="8" fill="#c94f3d"/>
  <circle cx="1214" cy="686" r="8" fill="#333a36"/>
  <circle cx="930" cy="580" r="8" fill="#2d8b75"/>

  <!-- PIR -->
  <path class="wire power" d="M 1460 164 V 734 H 1392"/>
  <path class="wire ground" d="M 1320 866 V 902"/>
  <path class="wire d3" d="M 664 700 H 970 V 800 H 1040"/>
  <g filter="url(#shadow)">
    <rect x="1040" y="720" width="360" height="158" rx="24" fill="#fffdf8" stroke="#397bb5" stroke-width="4"/>
    <circle cx="1117" cy="799" r="50" fill="#f0f0e8" stroke="#c9ccbd" stroke-width="4"/>
    <path d="M1083 799 Q1117 750 1151 799 Q1117 848 1083 799Z" fill="#dce0d5"/>
    <text x="1191" y="758" class="section">HC-SR501（可选）</text>
    <text x="1191" y="788" class="small">仅用于检测观察者靠近</text>
    <text x="1191" y="820" class="label" fill="#c94f3d">VCC → 5V</text>
    <text x="1191" y="848" class="label" fill="#397bb5">OUT → D3　 GND → GND</text>
  </g>
  <circle cx="1392" cy="734" r="8" fill="#c94f3d"/>
  <circle cx="1040" cy="800" r="8" fill="#397bb5"/>
  <circle cx="1320" cy="866" r="8" fill="#333a36"/>

  <!-- Notes -->
  <rect x="72" y="850" width="622" height="104" rx="18" fill="#fff8df" stroke="#b9842d" stroke-width="3"/>
  <text x="98" y="884" class="label" fill="#8a5c16">接线前请断开 USB 电源</text>
  <text x="98" y="914" class="small">D0 / D1 留给 USB 串口；全部 GND 必须共地。</text>
  <text x="98" y="941" class="small">电机、风扇、补光灯不得直接接 GPIO 或 UNO 5V。</text>

  <!-- Wire legend -->
  <g transform="translate(1000 944)">
    <line x1="0" y1="0" x2="44" y2="0" class="wire power"/><text x="58" y="6" class="tiny">5V</text>
    <line x1="112" y1="0" x2="156" y2="0" class="wire ground"/><text x="170" y="6" class="tiny">GND</text>
    <line x1="246" y1="0" x2="290" y2="0" class="wire d2"/><text x="304" y="6" class="tiny">D2</text>
    <line x1="356" y1="0" x2="400" y2="0" class="wire a0"/><text x="414" y="6" class="tiny">A0</text>
    <line x1="466" y1="0" x2="510" y2="0" class="wire d3"/><text x="524" y="6" class="tiny">D3</text>
  </g>
</svg>
